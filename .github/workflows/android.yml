name: Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # 変更がなくてもリリースを作り直せるようにする (署名鍵を登録したあとなど)
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  # リリースの途中で止めると中途半端なリリースが残るので、打ち切るのは PR のビルドだけにする
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # main のビルドを Releases に載せる
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      # 署名鍵を登録していないリポジトリ (フォークなど) でもビルドは通す。
      # その場合はデバッグ鍵の署名になり、前のバージョンへの上書き更新はできない
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      SELFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SELFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SELFY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Android は versionCode が増えていないと上書き更新できないので、実行のたびに増える番号を使う
      SELFY_VERSION_CODE: ${{ github.run_number }}
      RELEASE: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: 署名鍵とバージョン名を用意する
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/selfy.jks"
            echo "SELFY_KEYSTORE=$RUNNER_TEMP/selfy.jks" >> "$GITHUB_ENV"
          fi
          if [ "$RELEASE" = "true" ]; then
            base=$(grep '^selfy.version=' gradle.properties | cut -d= -f2)
            echo "SELFY_VERSION_NAME=$base.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          else
            echo "SELFY_VERSION_NAME=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - run: ./gradlew testDebugUnitTest assembleRelease

      - run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/selfy.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: selfy-apk
          path: ${{ runner.temp }}/selfy.apk

      - name: Releases に載せる
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v$SELFY_VERSION_NAME" "$RUNNER_TEMP/selfy.apk" \
            --target "$GITHUB_SHA" --title "Android $SELFY_VERSION_NAME" --generate-notes
