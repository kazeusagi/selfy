name: Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  # スマホからでもリリースできるよう、タグを打つ代わりに画面からバージョンを指定して実行できる
  workflow_dispatch:
    inputs:
      version:
        description: "リリースするバージョン (例: 0.1.0)。空ならビルドだけ行う"
        required: false
        type: string

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # タグを打ったときに Releases へ APK を載せる
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      # 署名鍵を登録していないリポジトリ (フォークなど) でもビルドは通す。
      # その場合はデバッグ鍵の署名になり、前のバージョンへの上書き更新はできない
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      SELFY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      SELFY_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      SELFY_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SELFY_VERSION_CODE: ${{ github.run_number }}
      VERSION_INPUT: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      - name: 署名鍵とバージョン名を用意する
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/selfy.jks"
            echo "SELFY_KEYSTORE=$RUNNER_TEMP/selfy.jks" >> "$GITHUB_ENV"
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "SELFY_VERSION_NAME=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
          elif [ -n "$VERSION_INPUT" ]; then
            if ! echo "$VERSION_INPUT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
              echo "バージョンは 0.1.0 のような形で指定してください: $VERSION_INPUT" >&2
              exit 1
            fi
            echo "SELFY_VERSION_NAME=$VERSION_INPUT" >> "$GITHUB_ENV"
          else
            echo "SELFY_VERSION_NAME=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - run: ./gradlew testDebugUnitTest assembleRelease

      - run: cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/selfy.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: selfy-apk
          path: ${{ runner.temp }}/selfy.apk

      - name: Releases に載せる
        if: github.ref_type == 'tag' || inputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-v$SELFY_VERSION_NAME"
          # GitHub の画面でリリースを先に作ってタグを打った場合は、そのリリースに APK を足す
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" "$RUNNER_TEMP/selfy.apk" --clobber
          else
            gh release create "$tag" "$RUNNER_TEMP/selfy.apk" --target "$GITHUB_SHA" --title "Android $SELFY_VERSION_NAME" --generate-notes
          fi
