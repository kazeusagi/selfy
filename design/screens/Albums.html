<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Selfy アルバム一覧</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#18181B;text-decoration:none}a:hover{color:#2747D6}
input:focus{outline:2px solid #2747D6;outline-offset:1px}
</style>
</helmet>
<div style="min-height: 1100px; background: #FAFAF9; color: #18181B; font-family: Inter, 'Noto Sans JP', sans-serif">
  <header style="position: sticky; top: 0; background: rgba(250,250,249,0.92); border-bottom: 1px solid #E4E4E7; z-index: 2">
    <div style="max-width: 1280px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px; box-sizing: border-box">
      <a href="Albums.html" style="display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em">
        <span style="width: 30px; height: 30px; border-radius: 9px; background: #2747D6; display: flex; align-items: center; justify-content: center">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"></rect><circle cx="12" cy="12" r="3.5"></circle></svg>
        </span>
        Selfy
      </a>
      <nav aria-label="メインメニュー" style="display: flex; gap: 4px">
        <a href="Albums.html" aria-current="page" style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 14px; font-weight: 600; background: #F0EFEC; color: #18181B">アルバム</a>
        <a href="Favorites.html" style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 14px; font-weight: 500; color: #52525B">お気に入り</a>
      </nav>
      <div style="flex: 1 1 280px; max-width: 480px; margin: 0 auto; position: relative">
        <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">検索</label>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#71717A" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 14px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="アルバムや写真を検索" style="width: 100%; height: 44px; box-sizing: border-box; border: 1px solid #E4E4E7; border-radius: 22px; padding: 0 16px 0 42px; font: inherit; font-size: 14px; background: #FFFFFF; color: #18181B">
      </div>
      <div style="display: flex; align-items: center; gap: 10px">
        <button style="height: 44px; padding: 0 18px; border: none; border-radius: 22px; background: #2747D6; color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"></path><path d="m6 10 6-6 6 6"></path><path d="M4 20h16"></path></svg>
          アップロード
        </button>
        <a href="Settings.html" aria-label="設定とアカウント" style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 22px; border: 1px solid #E4E4E7; background: #E9E4DC; color: #18181B; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center">T</a>
      </div>
    </div>
  </header>
  <main style="max-width: 1280px; margin: 0 auto; padding: 40px 32px 64px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px">
    <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -0.02em">アルバム</h1>
        <p style="margin: 0; font-size: 14px; color: #52525B">6 アルバム · 1,284 枚 · 8.2 GB 使用中</p>
      </div>
      <div role="tablist" aria-label="表示切り替え" style="display: flex; gap: 4px; padding: 4px; background: #F0EFEC; border-radius: 12px">
        <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
          <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 28px 20px">
      <sc-for list="{{albums}}" as="a" hint-placeholder-count="6">
        <a href="Album.html" style="display: flex; flex-direction: column; gap: 12px">
          <div style="aspect-ratio: 4 / 3; border-radius: 16px; overflow: hidden; display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 3px; position: relative">
            <div style="background: {{a.c1}}; grid-row: span 2"></div>
            <div style="background: {{a.c2}}"></div>
            <div style="background: {{a.c3}}"></div>
            <sc-if value="{{a.shared}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; left: 10px; top: 10px; height: 28px; padding: 0 10px; border-radius: 14px; background: rgba(24,24,27,0.72); color: #FFFFFF; font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M21.5 20c0-3-2-5.5-4.5-6.3"></path></svg>
                {{a.sharedLabel}}
              </span>
            </sc-if>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; padding: 0 2px">
            <span style="font-size: 16px; font-weight: 600">{{a.title}}</span>
            <span style="font-size: 13px; color: #52525B">{{a.meta}}</span>
          </div>
        </a>
      </sc-for>
      <button style="aspect-ratio: 4 / 3; border-radius: 16px; border: 1.5px dashed #D4D4D8; background: transparent; color: #52525B; font: inherit; font-size: 14px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        新しいアルバム
      </button>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'all' };
  }
  renderVals() {
    const tabDefs = [
      { id: 'all', label: 'すべて' },
      { id: 'mine', label: '自分のアルバム' },
      { id: 'shared', label: '共有されたアルバム' }
    ];
    const tabs = tabDefs.map((t) => {
      const on = this.state.tab === t.id;
      return {
        ...t,
        selected: on ? 'true' : 'false',
        pick: () => this.setState({ tab: t.id }),
        style: 'height: 36px; padding: 0 14px; border: none; border-radius: 9px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; ' + (on ? 'background: #FFFFFF; color: #18181B; box-shadow: 0 1px 2px rgba(0,0,0,0.08)' : 'background: transparent; color: #52525B')
      };
    });
    const all = [
      { title: '京都 秋の旅', meta: '248 枚 · 2026年10月', c1: '#A48B78', c2: '#C9B8A3', c3: '#6E7F6A', shared: true, sharedLabel: '3人と共有', owner: 'mine' },
      { title: '週末のさんぽ', meta: '96 枚 · 2026年9月', c1: '#8FA3B0', c2: '#D6CFC2', c3: '#5F6B73', shared: false, owner: 'mine' },
      { title: '実家の庭', meta: '57 枚 · 2026年8月', c1: '#6E7F6A', c2: '#9AAE9F', c3: '#E3DCD2', shared: true, sharedLabel: '家族と共有', owner: 'mine' },
      { title: '沖縄 2026夏', meta: '312 枚 · 2026年7月', c1: '#B9C4CE', c2: '#8FA3B0', c3: '#CDB6A0', shared: false, owner: 'mine' },
      { title: 'むぎ（ねこ）', meta: '421 枚 · 更新 昨日', c1: '#CDB6A0', c2: '#A48B78', c3: '#D6CFC2', shared: false, owner: 'mine' },
      { title: '佐藤さんの結婚式', meta: '150 枚 · 佐藤 健さんから共有', c1: '#E3DCD2', c2: '#5F6B73', c3: '#B9C4CE', shared: true, sharedLabel: '共有されています', owner: 'shared' }
    ];
    const albums = all.filter((a) => {
      if (this.state.tab === 'mine') return a.owner === 'mine';
      if (this.state.tab === 'shared') return a.owner === 'shared';
      return true;
    });
    return { tabs, albums };
  }
}
</script>
</body>
</html>
