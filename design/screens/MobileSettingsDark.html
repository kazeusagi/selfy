<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Selfy 設定（スマホ）（ダーク）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}:root{color-scheme:dark}
a{color:#F4F4F5;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #7C93FF;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #0F0F10; color: #F4F4F5; font-family: Inter, 'Noto Sans JP', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 16px 110px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">
    <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">設定</h1>

    <div style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #1A1A1C; border: 1px solid #2A2A2E; border-radius: 16px">
      <span style="flex: none; width: 52px; height: 52px; border-radius: 26px; background: #3A342C; font-size: 20px; font-weight: 600; display: flex; align-items: center; justify-content: center">T</span>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 17px; font-weight: 600">あなた</span>
        <span style="font-size: 13px; color: #A1A1AA; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">owner@example.com</span>
      </div>
      <button style="height: 36px; padding: 0 14px; border: 1px solid #3A3A3F; border-radius: 18px; background: transparent; color: #F4F4F5; font: inherit; font-size: 13px; font-weight: 600">編集</button>
    </div>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #A1A1AA">表示</h2>
      <div style="background: #1A1A1C; border: 1px solid #2A2A2E; border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
        <span id="theme-label" style="font-size: 15px; font-weight: 500">テーマ</span>
        <div role="radiogroup" aria-labelledby="theme-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #232326; border-radius: 12px">
          <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
            <button role="radio" aria-checked="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="background: #1A1A1C; border: 1px solid #2A2A2E; border-radius: 16px; overflow: hidden">
        <button style="width: 100%; min-height: 52px; padding: 0 16px; border: none; background: transparent; color: #F4F4F5; font: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
          <span style="flex: 1; font-size: 15px">ログイン画面の写真</span>
          <span style="font-size: 14px; color: #A1A1AA">14 枚</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
        </button>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #A1A1AA">アップロード</h2>
      <div style="background: #1A1A1C; border: 1px solid #2A2A2E; border-radius: 16px; overflow: hidden">
        <sc-for list="{{toggles}}" as="s" hint-placeholder-count="3">
          <div style="min-height: 60px; padding: 10px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; border-top: {{s.border}}">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
              <span id="{{s.id}}" style="font-size: 15px">{{s.label}}</span>
              <span style="font-size: 12px; color: #A1A1AA">{{s.desc}}</span>
            </div>
            <button role="switch" aria-checked="{{s.checked}}" aria-labelledby="{{s.id}}" onClick="{{s.flip}}" style="flex: none; width: 52px; height: 32px; border: none; border-radius: 16px; padding: 3px; background: {{s.bg}}; display: flex; justify-content: {{s.justify}}">
              <span style="width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)"></span>
            </button>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #A1A1AA">ストレージ</h2>
      <div style="background: #1A1A1C; border: 1px solid #2A2A2E; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <span style="font-size: 22px; font-weight: 700">8.2 GB</span>
          <span style="font-size: 13px; color: #A1A1AA">Cloudflare R2</span>
        </div>
        <div role="img" aria-label="写真 7.6 GB、サムネイル 0.6 GB" style="height: 8px; border-radius: 4px; background: #232326; display: flex; overflow: hidden">
          <span style="width: 76%; background: #3B5BF0"></span>
          <span style="width: 6%; background: #9DB0FF"></span>
        </div>
        <div style="display: flex; gap: 16px; font-size: 12px; color: #A1A1AA">
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #3B5BF0"></span>写真 7.6 GB</span>
          <span style="display: flex; align-items: center; gap: 6px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #9DB0FF"></span>サムネイル 0.6 GB</span>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 13px; font-weight: 600; color: #A1A1AA">アカウントと共有</h2>
      <div style="background: #1A1A1C; border: 1px solid #2A2A2E; border-radius: 16px; overflow: hidden">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
          <button style="width: 100%; min-height: 52px; padding: 0 16px; border: none; border-top: {{r.border}}; background: transparent; color: #F4F4F5; font: inherit; display: flex; align-items: center; gap: 12px; text-align: left">
            <span style="flex: 1; font-size: 15px">{{r.label}}</span>
            <span style="font-size: 14px; color: #A1A1AA">{{r.value}}</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg>
          </button>
        </sc-for>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <button style="height: 52px; border: 1px solid #2A2A2E; border-radius: 16px; background: #1A1A1C; color: #FF8A80; font: inherit; font-size: 15px; font-weight: 600">ログアウト</button>
      <p style="margin: 0; text-align: center; font-size: 12px; color: #A1A1AA">Selfy v0.1.0 · オープンソース（MIT）</p>
    </div>
  </div>

  <nav aria-label="メインメニュー" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding-bottom: 16px; box-sizing: border-box; background: rgba(15,15,16,0.92); border-top: 1px solid #2A2A2E; display: flex">
    <a href="MobileAlbumsDark.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #A1A1AA">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
      アルバム
    </a>
    <a href="MobileFavoritesDark.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #A1A1AA">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      お気に入り
    </a>
    <a href="MobileAlbumsDark.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #A1A1AA">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M21.5 20c0-3-2-5.5-4.5-6.3"></path></svg>
      共有
    </a>
    <a href="MobileSettingsDark.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #9DB0FF">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      設定
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { theme: 'system', original: true, stripGps: true, wifiOnly: false };
  }
  renderVals() {
    const s = this.state;
    const themeDefs = [
      { id: 'system', label: '自動' },
      { id: 'light', label: 'ライト' },
      { id: 'dark', label: 'ダーク' }
    ];
    const themes = themeDefs.map((t) => {
      const on = s.theme === t.id;
      return {
        ...t,
        selected: on ? 'true' : 'false',
        pick: () => this.setState({ theme: t.id }),
        style: 'height: 40px; border: none; border-radius: 9px; font: inherit; font-size: 14px; font-weight: 600; ' + (on ? 'background: #1A1A1C; color: #F4F4F5; box-shadow: 0 1px 2px rgba(0,0,0,0.4)' : 'background: transparent; color: #A1A1AA')
      };
    });
    const toggleDefs = [
      { key: 'original', label: '元の画質で保存', desc: 'オフにすると長辺4000pxに縮小します' },
      { key: 'stripGps', label: '共有時に位置情報を削除', desc: '共有リンクの写真から撮影場所を消します' },
      { key: 'wifiOnly', label: 'Wi-Fi接続時のみアップロード', desc: 'モバイル通信量を節約します' }
    ];
    const toggles = toggleDefs.map((t, k) => ({
      ...t,
      id: 'sw-' + t.key,
      checked: s[t.key] ? 'true' : 'false',
      bg: s[t.key] ? '#3B5BF0' : '#3A3A3F',
      justify: s[t.key] ? 'flex-end' : 'flex-start',
      border: k === 0 ? 'none' : '1px solid #2A2A2E',
      flip: () => this.setState({ [t.key]: !s[t.key] })
    }));
    const rows = [
      { label: 'パスキー', value: '2 件' },
      { label: 'ログイン中の端末', value: '3 台' },
      { label: '共有リンクの既定の期限', value: '7日間' },
      { label: '共有中のアルバム', value: '2 件' }
    ].map((r, k) => ({ ...r, border: k === 0 ? 'none' : '1px solid #2A2A2E' }));
    return { themes, toggles, rows };
  }
}
</script>
</body>
</html>
