<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Selfy お気に入り（スマホ）</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#18181B;text-decoration:none}
button:focus-visible,a:focus-visible{outline:2px solid #2747D6;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; position: relative; background: #FAFAF9; color: #18181B; font-family: Inter, 'Noto Sans JP', sans-serif; display: flex; flex-direction: column">
  <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 20px 0 100px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <div style="padding: 0 16px; display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em">お気に入り</h1>
        <span style="font-size: 13px; color: #52525B">14 枚 · 6 アルバムから</span>
      </div>
      <button aria-label="選択" style="height: 36px; padding: 0 14px; border: 1px solid #D4D4D8; border-radius: 18px; background: transparent; color: #18181B; font: inherit; font-size: 14px; font-weight: 600">選択</button>
    </div>
    <div role="tablist" aria-label="並び替え" style="padding: 0 16px; display: flex; gap: 8px">
      <sc-for list="{{sorts}}" as="t" hint-placeholder-count="3">
        <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px">
      <sc-for list="{{photos}}" as="p" hint-placeholder-count="14">
        <a href="MobileLightbox.html" aria-label="{{p.label}}" style="aspect-ratio: 1 / 1; position: relative; display: block; overflow: hidden; background: #E4E4E7">
          <img src="{{p.src}}" alt="" style="width: 100%; height: 100%; object-fit: cover; display: block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true" style="position: absolute; right: 6px; bottom: 6px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4))"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
        </a>
      </sc-for>
    </div>
  </div>

  <nav aria-label="メインメニュー" style="position: absolute; left: 0; right: 0; bottom: 0; height: 80px; padding-bottom: 16px; box-sizing: border-box; background: rgba(250,250,249,0.94); border-top: 1px solid #E4E4E7; display: flex">
    <a href="MobileAlbums.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #52525B">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"></rect><rect x="13" y="3" width="8" height="8" rx="2"></rect><rect x="3" y="13" width="8" height="8" rx="2"></rect><rect x="13" y="13" width="8" height="8" rx="2"></rect></svg>
      アルバム
    </a>
    <a href="MobileFavorites.html" aria-current="page" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 600; color: #2747D6">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
      お気に入り
    </a>
    <a href="MobileAlbums.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #52525B">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7"></path><path d="M21.5 20c0-3-2-5.5-4.5-6.3"></path></svg>
      共有
    </a>
    <a href="MobileSettings.html" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; font-weight: 500; color: #52525B">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
      設定
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sort: 'new' };
  }
  renderVals() {
    const ids = ['../images/photo08.jpg', '../images/photo06.jpg', '../images/photo13.jpg', '../images/photo10.jpg', '../images/photo12.jpg', '../images/photo02.jpg', '../images/photo07.jpg', '../images/photo01.jpg', '../images/photo04.jpg', '../images/photo11.jpg', '../images/photo03.jpg', '../images/photo14.jpg', '../images/photo05.jpg', '../images/photo09.jpg'];
    const list = this.state.sort === 'old' ? [...ids].reverse() : ids;
    const photos = list.map((id, k) => ({ src: id, label: 'お気に入りの写真 ' + (k + 1) }));
    const defs = [
      { id: 'new', label: '新しい順' },
      { id: 'old', label: '古い順' },
      { id: 'album', label: 'アルバム別' }
    ];
    const sorts = defs.map((t) => {
      const on = this.state.sort === t.id;
      return {
        ...t,
        selected: on ? 'true' : 'false',
        pick: () => this.setState({ sort: t.id }),
        style: 'height: 36px; padding: 0 16px; border-radius: 18px; font: inherit; font-size: 14px; font-weight: 600; ' + (on ? 'border: 1px solid #18181B; background: #18181B; color: #FFFFFF' : 'border: 1px solid #D4D4D8; background: transparent; color: #18181B')
      };
    });
    return { photos, sorts };
  }
}
</script>
</body>
</html>
